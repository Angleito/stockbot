# Stockbot thesis monitor: one parameterized service built from the repo Dockerfile.
# Second thesis: `THESIS_ID=<other-id> docker compose run -e THESIS_ID thesis-monitor`
# (or copy this service block with a distinct THESIS_ID under `services:`).
services:
  thesis-monitor:
    build: .
    image: stockbot-thesis-monitor
    working_dir: /app
    volumes:
      - ${STOCKBOT_DATA_DIR:-./data}:/data
    environment:
      THESIS_ID: ${THESIS_ID:?THESIS_ID required}
      STOCKBOT_DATA_DIR: /data
    command: /app/venv/bin/python cli.py thesis monitor ${THESIS_ID:?THESIS_ID required} --interval-seconds ${INTERVAL_SECONDS:-900}
    restart: unless-stopped
