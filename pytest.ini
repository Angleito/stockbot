[pytest]
pythonpath = .
testpaths = tests
addopts = -m "not integration and not finra_smoke and not finra_production_smoke and not robinhood_smoke"
markers =
    integration: tests that call live SEC/OpenRouter services
    finra_smoke: opt-in live FINRA mock-endpoint smoke test (RUN_FINRA_SMOKE=1 + credentials)
    finra_production_smoke: opt-in live FINRA production smoke test (RUN_FINRA_PRODUCTION_SMOKE=1 + credentials)
    robinhood_smoke: opt-in live Robinhood MCP smoke test (RUN_ROBINHOOD_SMOKE=1 + OAuth state)
